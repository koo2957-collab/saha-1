<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE SLOTBOARD - 페이지를 찾을 수 없습니다</title>
    <style>
        body {
            background: #121212;
            color: #EAEAEA;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .error-container {
            max-width: 500px;
            padding: 40px;
            background: #1E1E1E;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .error-icon {
            font-size: 64px;
            color: #FF9900;
            margin-bottom: 20px;
        }
        h1 {
            color: #FF9900;
            margin-bottom: 20px;
        }
        p {
            color: #B3B3B3;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .home-btn {
            background: #FF9900;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            background: #e68900;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔥</div>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p>
            요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>
            FIRE SLOTBOARD 메인 페이지로 돌아가시거나<br>
            URL을 다시 확인해주세요.
        </p>
        <a href="/saha-1/" class="home-btn">🏠 메인 페이지로 이동</a>
    </div>
    
    <script>
        // 자동으로 메인 페이지로 리다이렉트 (5초 후)
        setTimeout(function() {
            window.location.href = '/saha-1/';
        }, 5000);
    </script>
</body>
</html>
